<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NarChat nar maskotu">
  <defs>
    <radialGradient id="nar" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#e2415b"/>
      <stop offset="52%" stop-color="#c0223f"/>
      <stop offset="100%" stop-color="#8a1430"/>
    </radialGradient>
    <linearGradient id="sapka" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2030"/>
      <stop offset="100%" stop-color="#241019"/>
